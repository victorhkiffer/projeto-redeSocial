services:
  db:
    image: postgres:16
    container_name: conecta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conecta_empreendedor}
      POSTGRES_USER: ${POSTGRES_USER:-conecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conecta_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
